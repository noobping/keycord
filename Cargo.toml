[package]
name = "keycord"
description = "Browse and edit password stores"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[workspace]
members = [
    "crates/keycord-architecture",
    "crates/keycord-docs",
    "crates/keycord-entries",
    "crates/keycord-fido",
    "crates/keycord-git",
    "crates/keycord-keys",
    "crates/keycord-lifecycle",
    "crates/keycord-passkey",
    "crates/keycord-preferences",
    "crates/keycord-runtime",
    "crates/keycord-shell",
    "crates/keycord-stores",
    "crates/keycord-ui-fragments",
]
default-members = ["."]
resolver = "2"

[workspace.package]
authors = ["noobping <hello@noobping.dev>"]
version = "0.9.12"
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://github.com/noobping/keycord"
repository = "https://github.com/noobping/keycord"

[workspace.dependencies]
keycord-docs = { path = "crates/keycord-docs", default-features = false }
keycord-entries = { path = "crates/keycord-entries", default-features = false }
keycord-fido = { path = "crates/keycord-fido", default-features = false }
keycord-git = { path = "crates/keycord-git", default-features = false }
keycord-keys = { path = "crates/keycord-keys", default-features = false }
keycord-lifecycle = { path = "crates/keycord-lifecycle", default-features = false }
keycord-passkey = { path = "crates/keycord-passkey", default-features = false }
keycord-preferences = { path = "crates/keycord-preferences", default-features = false }
keycord-runtime = { path = "crates/keycord-runtime", default-features = false }
keycord-shell = { path = "crates/keycord-shell", default-features = false }
keycord-stores = { path = "crates/keycord-stores", default-features = false }
keycord-ui-fragments = { path = "crates/keycord-ui-fragments", default-features = false }

[features]
audit = [
    "dep:sequoia-openpgp",
    "keycord-git/audit",
    "keycord-keys/audit",
]
default = []
docs = ["keycord-docs/docs"]
fidokey = [
    "dep:keycord-fido",
    "keycord-fido/native-transport",
    "keycord-fido/ui",
    "keycord-keys/fido-ui",
]
fidopin = [
    "fidokey",
    "keycord-fido/pin-setup",
    "keycord-keys/fidopin",
]
flatpak = [
    "docs",
    "audit",
    "smartcard",
    "logging",
    "passkey",
    "keycord-preferences/flatpak",
    "keycord-git/flatpak",
    "keycord-lifecycle/flatpak",
    "keycord-keys/flatpak",
    "keycord-fido?/flatpak",
    "keycord-runtime/flatpak",
]
hardwarekey = ["smartcard", "keycord-keys/hardwarekey"]
logging = ["keycord-shell/logging"]
passkey = [
    "keycord-entries/passkey",
    "keycord-passkey/passkey",
    "keycord-passkey/ui",
]
setup = [
    "docs",
    "audit",
    "smartcard",
    "logging",
    "keycord-lifecycle/setup",
]
smartcard = ["keycord-keys/smartcard"]

[dependencies]
keycord-docs = { workspace = true, default-features = false, features = ["ui"] }
keycord-entries = { workspace = true, features = ["ui"] }
keycord-fido = { workspace = true, optional = true, default-features = false }
keycord-git = { workspace = true, features = ["ui"] }
keycord-lifecycle = { workspace = true, features = ["ui"] }
keycord-keys = { workspace = true, features = ["ui"] }
keycord-passkey = { workspace = true, default-features = false }
keycord-preferences = { workspace = true, features = ["ui"] }
keycord-runtime.workspace = true
keycord-shell.workspace = true
keycord-stores = { workspace = true, features = ["ui"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["gtk_v4_18", "v1_8"] }
sequoia-openpgp = { version = "2.4.1", optional = true }
dirs-next = "2.0.0"

[build-dependencies]
keycord-lifecycle = { workspace = true, features = ["build-support"] }
keycord-passkey = { workspace = true, default-features = false }

[dev-dependencies]
keycord-fido = { workspace = true, features = ["test-support"] }
keycord-keys = { workspace = true, features = ["test-support"] }
ripasso = "0.8.0"
secrecy = "0.10.3"
sequoia-openpgp = "2.4.1"
