[package]
name = "keycord-docs"
description = "Bundled documentation and presentation for Keycord"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = []
docs = ["ui", "dep:keycord-runtime", "dep:pulldown-cmark"]
ui = ["dep:adw", "dep:keycord-shell"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["gtk_v4_18", "v1_8"], optional = true }
keycord-runtime = { workspace = true, optional = true }
keycord-shell = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13.4", optional = true }
