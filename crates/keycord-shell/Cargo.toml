[package]
name = "keycord-shell"
description = "Application shell and generic GTK integration for Keycord"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = []
logging = ["keycord-runtime/logging"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["gtk_v4_18", "v1_8"] }
keycord-runtime.workspace = true
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"

[build-dependencies]
keycord-ui-fragments.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
dirs-next = "2.0.0"
winsafe = { version = "0.0.28", features = ["shell"] }
