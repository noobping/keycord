[package]
name = "keycord-preferences"
description = "Preferences persistence and presentation for Keycord"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = []
flatpak = ["keycord-runtime/flatpak"]
ui = ["dep:adw", "dep:keycord-shell"]

[dependencies]
keycord-runtime.workspace = true
keycord-shell = { workspace = true, optional = true }
adw = { version = "0.9.2", package = "libadwaita", features = ["gtk_v4_18", "v1_8"], optional = true }
dirs-next = "2.0.0"
gio = "0.22.1"
glib = "0.22.3"
serde = { version = "1.0.229", features = ["derive"] }
shellexpand = "3.1.2"
toml = "1.1.4"

[target.'cfg(target_os = "linux")'.dependencies]
shlex = "2.0.1"
