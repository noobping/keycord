[package]
name = "keycord-lifecycle"
description = "Setup, update, and desktop integration for Keycord"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = []
build-support = ["dep:glib-build-tools", "dep:keycord-ui-fragments", "dep:winresource"]
flatpak = ["keycord-runtime/flatpak"]
setup = ["dep:dirs-next", "dep:gio"]
ui = [
    "dep:adw",
    "dep:dirs-next",
    "dep:keycord-shell",
    "dep:rand",
    "dep:reqwest",
    "dep:semver",
    "dep:serde",
    "dep:sha2",
]

[dependencies]
keycord-runtime.workspace = true
keycord-shell = { workspace = true, optional = true }
keycord-ui-fragments = { workspace = true, optional = true }
adw = { version = "0.9.2", package = "libadwaita", features = ["gtk_v4_18", "v1_8"], optional = true }
dirs-next = { version = "2.0.0", optional = true }
gio = { version = "0.22.1", optional = true }
glib-build-tools = { version = "0.22.8", optional = true }
rand = { version = "0.10.0", optional = true }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking", "json", "rustls"] }
semver = { version = "1.0.28", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha2 = { version = "0.11.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winresource = { version = "0.1.31", optional = true }
